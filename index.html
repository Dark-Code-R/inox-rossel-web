<!doctype html>
<html lang="es" class="is-site-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2336" />
    <link rel="stylesheet" href="/loader.css" />
    <title>Inox Rossel | Metal y Madera Profesional</title>
    <meta
      name="description"
      content="Proyectos profesionales en metal y madera, fabricados en Oruro, Bolivia. Equipos industriales, mobiliario personalizado y estructuras a medida."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="keywords"
      content="inox, metalmecánica, carpintería, Bolivia, Oruro, muebles personalizados, estructuras metálicas, cocina industrial"
    />
    <meta name="author" content="Rodolfo Rossel" />
  </head>
  <body>
    <div id="site-loader" role="status" aria-label="Cargando Inox Rossel">
      <div class="loader-symbol" aria-hidden="true"><i></i><i></i></div>
      <div class="loader-name" aria-hidden="true">
        INOX <strong>ROSSEL<em>.</em></strong
        ><small>METAL &amp; MADERA</small>
      </div>
      <div class="loader-progress" aria-hidden="true"><span></span></div>
      <p class="loader-message">PREPARANDO ALGO BIEN HECHO</p>
      <span class="loader-signature" aria-hidden="true"
        >ORURO, BOLIVIA / DISEÑO A MEDIDA</span
      >
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script>
      // Keep the site accessible even if the application fails during startup.
      window.setTimeout(() => {
        document.getElementById("site-loader")?.remove();
        document.getElementById("root")?.removeAttribute("inert");
        document.getElementById("root")?.removeAttribute("aria-busy");
        document.documentElement.classList.remove("is-site-loading");
      }, 8000);
    </script>
    <noscript
      ><style>
        #site-loader {
          display: none;
        }
      </style>
      <p>
        Activa JavaScript para explorar los proyectos de Inox Rossel.
      </p></noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
